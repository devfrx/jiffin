[project]
name = "jiffin"
version = "0.2.0"
description = "Contextual reminders for Windows 11, judged by a local language model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "comtypes>=1.4.17",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyside6-essentials>=6.11.2",
    # Pinned exactly: scripts/package.py packs with the vpk of the same version (ADR-0015).
    "velopack==1.2.161",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    # Pinned exactly: Ruff's minor releases are the ones that may break (ADR-0016).
    "ruff==0.16.9",
    "types-psutil>=7.2.2.20260906",
]
harness = [
    "psutil>=7.2.2",
]
# Only to build the installer: `uv run --group package scripts/package.py` (ADR-0015).
package = [
    "pyinstaller==6.22.3",
]

[tool.uv]
# uv's builds ship a SQLite without the WAL-reset bug; the python.org ones do not (ADR-0013).
python-preference = "only-managed"
# The harness is checked by the same hooks as the app, so its group is always installed.
default-groups = ["dev", "harness"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# comtypes ships no types, and builds its COM interfaces at run time.
module = ["comtypes", "comtypes.*"]
ignore_missing_imports = true

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration and not benchmark"]
markers = [
    "integration: needs the owner's machine, with the model on the GPU, or the browsers or the alerts in front; run with `uv run pytest -m integration`",
    "benchmark: measures for minutes, alone on the owner's machine; run with `uv run pytest -m benchmark -s`",
]
qt_api = "pyside6"
# A QML binding that breaks only logs a warning: in a test, it fails.
qt_log_level_fail = "WARNING"

[tool.pyside6-project]
# What `pyside6-project build` reads (ADR-0016): the QML files, the Python files that register
# QML types, and one with a main. It writes the types for qmllint into Jiffin/, ignored by git.
files = [
    "src/jiffin/ui/__main__.py",
    "src/jiffin/ui/alert.py",
    "src/jiffin/ui/catalog.py",
    "src/jiffin/ui/creation.py",
    "src/jiffin/ui/first_run.py",
    "src/jiffin/ui/look.py",
    "src/jiffin/ui/preferences.py",
    "src/jiffin/ui/remind_here.py",
    "src/jiffin/ui/tray.py",
    "src/jiffin/ui/tray_list.py",
    "src/jiffin/ui/qml/AlertMenu.qml",
    "src/jiffin/ui/qml/AlertWindow.qml",
    "src/jiffin/ui/qml/Colors.qml",
    "src/jiffin/ui/qml/CreationWindow.qml",
    "src/jiffin/ui/qml/FirstRunWindow.qml",
    "src/jiffin/ui/qml/FluentButton.qml",
    "src/jiffin/ui/qml/FluentCheckBox.qml",
    "src/jiffin/ui/qml/FluentComboBox.qml",
    "src/jiffin/ui/qml/FluentInfoBar.qml",
    "src/jiffin/ui/qml/FluentMenuItem.qml",
    "src/jiffin/ui/qml/FluentNumberBox.qml",
    "src/jiffin/ui/qml/FluentProgressBar.qml",
    "src/jiffin/ui/qml/FluentRadioButton.qml",
    "src/jiffin/ui/qml/FluentScrollBar.qml",
    "src/jiffin/ui/qml/FluentTextBox.qml",
    "src/jiffin/ui/qml/PreferencesWindow.qml",
    "src/jiffin/ui/qml/RemindHereWindow.qml",
    "src/jiffin/ui/qml/Texts.qml",
    "src/jiffin/ui/qml/TrayIcon.qml",
    "src/jiffin/ui/qml/TrayListWindow.qml",
    "src/jiffin/ui/qml/Typography.qml",
]

[tool.coverage.run]
source_pkgs = ["jiffin"]
# Measures the engine child process; pytest-cov 7 no longer does it on its own.
patch = ["subprocess"]

# The boundaries of ADR-0012 and ADR-0017; a new rule there becomes a contract here.
[tool.importlinter]
root_package = "jiffin"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only ui and app import PySide6"
type = "forbidden"
source_modules = [
    "jiffin.lang",
    "jiffin.core",
    "jiffin.protocol",
    "jiffin.engine",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.harness",
]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "Only app imports velopack"
type = "forbidden"
source_modules = [
    "jiffin.lang",
    "jiffin.core",
    "jiffin.protocol",
    "jiffin.engine",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.ui",
    "jiffin.harness",
]
forbidden_modules = ["velopack"]

[[tool.importlinter.contracts]]
name = "lang imports nothing else from jiffin"
type = "forbidden"
source_modules = ["jiffin.lang"]
forbidden_modules = [
    "jiffin.core",
    "jiffin.protocol",
    "jiffin.engine",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.ui",
    "jiffin.app",
    "jiffin.harness",
]

[[tool.importlinter.contracts]]
name = "core imports only lang from jiffin"
type = "forbidden"
source_modules = ["jiffin.core"]
forbidden_modules = [
    "jiffin.protocol",
    "jiffin.engine",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.ui",
    "jiffin.app",
    "jiffin.harness",
]

[[tool.importlinter.contracts]]
name = "protocol imports only lang from jiffin"
type = "forbidden"
source_modules = ["jiffin.protocol"]
forbidden_modules = [
    "jiffin.core",
    "jiffin.engine",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.ui",
    "jiffin.app",
    "jiffin.harness",
]

[[tool.importlinter.contracts]]
name = "engine imports only protocol and lang from jiffin"
type = "forbidden"
source_modules = ["jiffin.engine"]
forbidden_modules = [
    "jiffin.core",
    "jiffin.client",
    "jiffin.platform",
    "jiffin.store",
    "jiffin.ui",
    "jiffin.app",
    "jiffin.harness",
]

[[tool.importlinter.contracts]]
name = "Nothing imports engine"
type = "protected"
protected_modules = ["jiffin.engine"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "ui imports none of engine, client, platform and store"
type = "forbidden"
source_modules = ["jiffin.ui"]
forbidden_modules = ["jiffin.engine", "jiffin.client", "jiffin.platform", "jiffin.store"]

[[tool.importlinter.contracts]]
name = "The adapters do not import each other"
type = "independence"
modules = ["jiffin.client", "jiffin.platform", "jiffin.store"]

[[tool.importlinter.contracts]]
name = "harness imports neither ui nor platform"
type = "forbidden"
source_modules = ["jiffin.harness"]
forbidden_modules = ["jiffin.ui", "jiffin.platform"]
# The statements page writes the time understood as the interface does (ADR-0021): ui.words is
# pure Python, without Qt.
ignore_imports = ["jiffin.harness.statements -> jiffin.ui.words"]

[[tool.importlinter.contracts]]
name = "Nothing imports harness"
type = "protected"
protected_modules = ["jiffin.harness"]
allowed_importers = []
