<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.label.title }}</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f2; --fg: #1d1c1a; --muted: #625f59; --line: #d9d6ce; --card: #ffffff;
    --on: #1d6b47; --on-bg: #e2f1e8; --off: #9a3412; --off-bg: #fbe9e1; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --fg: #ecebe5; --muted: #a8a59e; --line: #3d3c37; --card: #242320;
      --on: #74c79c; --on-bg: #1d3528; --off: #f0a07a; --off-bg: #3a2218; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 20px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--on); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; }
  .label, .done { color: var(--muted); font-size: 14px; }
  .done { margin-top: 8px; }
  .title { font-size: 20px; font-weight: 600; margin: 4px 0; overflow-wrap: anywhere; }
  .address { font-family: Consolas, ui-monospace, monospace; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .condition { font-size: 18px; margin-top: 4px; }
  .action { color: var(--muted); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    display: flex; gap: 10px; align-items: center; padding: 12px 14px; text-align: left;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: inherit; font: inherit; cursor: pointer;
  }
  .choice.yes[aria-pressed="true"] { border-color: var(--on); background: var(--on-bg); }
  .choice.no[aria-pressed="true"] { border-color: var(--off); background: var(--off-bg); }
  .key { flex: none; min-width: 1.7em; text-align: center; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--muted); }
  nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  nav button { padding: 10px 18px; font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; }
  nav button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
  .hint, .status { color: var(--muted); font-size: 13px; }
  .status { min-height: 1.3em; }
  .status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <header><span id="position">{{ t.label.loading }}</span><span id="count"></span></header>
  <div class="bar"><div id="bar"></div></div>
  <section id="pair" class="card"></section>
  <section id="question">
    <h2>{{ t.label.question }}</h2>
    <div class="choices">
      <button id="yes" class="choice yes" type="button"><span class="key">1</span>{{ t.label.yes }}</button>
      <button id="no" class="choice no" type="button"><span class="key">2</span>{{ t.label.no }}</button>
    </div>
  </section>
  <nav><button id="back" type="button">{{ t.label.back }}</button><button id="skip" type="button">{{ t.label.next }}</button></nav>
  <p class="hint">{{ t.label.hint }}</p>
  <p id="status" class="status" role="status"></p>
</main>
<script>
"use strict";
// The texts the script writes, from harness.toml.
const T = {{ texts | tojson }};
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
let data = null;
let index = 0;

function api(path) {
  return `${path}?t=${encodeURIComponent(token)}`;
}

// A text with its {names} filled from `values`.
function fill(text, values) {
  return text.replace(/\{(\w+)\}/g, (_, name) => String(values[name]));
}

// Titles, addresses and reminders are arbitrary text: they only ever go through textContent.
function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const isDone = (pair) => typeof data.answers[pair.key] === "boolean";

function nextToDo(from) {
  const i = data.pairs.findIndex((p, j) => j >= from && !isDone(p));
  return i === -1 ? data.pairs.length : i;
}

function setStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", isError);
}

function renderProgress() {
  const total = data.pairs.length;
  const done = data.pairs.filter(isDone).length;
  $("count").textContent = fill(T.done, { done, total });
  $("bar").style.width = `${(100 * done) / total}%`;
}

function showFinished() {
  $("position").textContent = T.finished;
  $("pair").append(
    element("div", "title", T.all_labelled),
    element("div", "label", T.may_close));
  $("question").hidden = true;
  $("skip").disabled = true;
}

function show(i) {
  const total = data.pairs.length;
  index = Math.max(0, Math.min(i, total));
  renderProgress();
  $("pair").replaceChildren();
  $("back").disabled = index === 0;
  if (index === total) {
    const missing = nextToDo(0);
    if (missing < total) {
      show(missing);
      setStatus(T.some_left);
      return;
    }
    showFinished();
    return;
  }
  $("question").hidden = false;
  $("skip").disabled = false;
  const pair = data.pairs[index];
  $("position").textContent = fill(T.position, { number: index + 1, total });
  const card = $("pair");
  card.append(element("div", "label", fill(T.was_on, { app: pair.app })),
    element("div", "title", pair.title || T.untitled));
  if (pair.address) card.append(element("div", "address", pair.address));
  card.append(element("div", "label", T.the_reminder), element("div", "condition", pair.remainder),
    element("div", "action", fill(T.remind_me, { action: pair.action })));
  if (isDone(pair)) card.append(element("div", "done", T.labelled));
  $("yes").setAttribute("aria-pressed", String(data.answers[pair.key] === true));
  $("no").setAttribute("aria-pressed", String(data.answers[pair.key] === false));
}

async function label(relevant) {
  const pair = data.pairs[index];
  if (!pair) return;
  try {
    const response = await fetch(api("/label"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: pair.key, relevant }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data.answers[pair.key] = relevant;
    show(nextToDo(index + 1));
    setStatus(T.saved);
  } catch (error) {
    setStatus(fill(T.not_saved, { error: error.message }), true);
  }
}

document.addEventListener("keydown", (event) => {
  if (!data || event.ctrlKey || event.altKey || event.metaKey) return;
  if (event.key === "1") { event.preventDefault(); label(true); }
  else if (event.key === "2") { event.preventDefault(); label(false); }
  else if (event.key === "Backspace" || event.key === "ArrowLeft") {
    event.preventDefault();
    if (index > 0) show(index - 1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    show(index + 1);
  }
});
$("yes").addEventListener("click", () => label(true));
$("no").addEventListener("click", () => label(false));
$("back").addEventListener("click", () => show(index - 1));
$("skip").addEventListener("click", () => show(index + 1));

fetch(api("/data"))
  .then((response) => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then((loaded) => {
    data = loaded;
    if (!data.pairs.length) {
      $("position").textContent = T.nothing;
      $("question").hidden = true;
      $("skip").disabled = true;
      $("back").disabled = true;
      return;
    }
    show(nextToDo(0));
  })
  .catch((error) => setStatus(fill(T.not_loaded, { error: error.message }), true));
</script>
</body>
</html>
